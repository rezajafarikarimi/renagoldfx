name: rena

services:
  db:
    image: postgres:16-alpine
    restart: on-failure
    environment:
      POSTGRES_USER: rena
      POSTGRES_PASSWORD: rena_local_dev
      POSTGRES_DB: rena
    volumes:
      - rena_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rena -d rena"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    labels:
      base44.kind: infra

  api:
    image: node:22-bookworm-slim
    restart: on-failure
    working_dir: /app
    env_file:
      - /run/base44/app.env
    environment:
      - DATABASE_URL=postgres://rena:rena_local_dev@db:5432/rena
      - PORT=4000
      - NODE_ENV=development
      - BASE44_PREVIEW_MODE
    volumes:
      - ./server:/app
      - rena_api_modules:/app/node_modules
    command: ["sh", "-ec", "npm install --no-audit --no-fund --loglevel=error && exec npm run dev"]
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 45s
    labels:
      base44.project: "RENA API"
      base44.kind: api

  web:
    image: node:22-bookworm-slim
    restart: on-failure
    working_dir: /app
    environment:
      - API_PROXY_TARGET=http://api:4000
      - BASE44_PREVIEW_MODE
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
    volumes:
      - ./client:/app
      - rena_web_modules:/app/node_modules
    command: ["sh", "-ec", "npm install --no-audit --no-fund --loglevel=error && exec npx vite --host 0.0.0.0 --port 5173"]
    ports:
      - "3000:5173"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:5173/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 60s
    labels:
      base44.project: "RENA Trading Couple"
      base44.kind: web
      base44.port: "3000"

volumes:
  rena_db:
  rena_api_modules:
  rena_web_modules:
